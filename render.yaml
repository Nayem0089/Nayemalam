# ==============================================================================
# RENDER.COM INFRASTRUCTURE BLUEPRINT (render.yaml)
# Fullstack Node.js + Express + React/Vite + Managed PostgreSQL
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Main Fullstack Web Service (Serves API + React SPA Frontend)
  # ----------------------------------------------------------------------------
  - type: web
    name: warzone-tournament-manager
    runtime: node
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: warzone-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin123
      # Optional S3-compatible Object Storage (Cloudflare R2 / AWS S3 / Backblaze B2)
      # If left blank, team logos fallback automatically to database storage!
      - key: S3_ENDPOINT
        value: ""
      - key: S3_BUCKET
        value: ""
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""
      - key: S3_REGION
        value: "auto"
      - key: S3_PUBLIC_URL
        value: ""

# ------------------------------------------------------------------------------
# 2. Managed PostgreSQL Database (Render Free Tier Compatible)
# ------------------------------------------------------------------------------
databases:
  - name: warzone-postgres
    plan: free
    region: oregon
    databaseName: warzone_tournament
    user: warzone_admin
